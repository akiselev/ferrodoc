[package]
name = "ferrodoc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
ferrodoc-core = { path = "../crates/ferrodoc-core" }
ferrodoc-ir = { path = "../crates/ferrodoc-ir" }
ferrodoc-pdf = { path = "../crates/ferrodoc-pdf" }
ferrodoc-protocol = { path = "../crates/ferrodoc-protocol" }
ferrodoc-render = { path = "../crates/ferrodoc-render" }
libfuzzer-sys = "0.4"
serde_json = "1.0"

[[bin]]
name = "protocol_frame"
path = "fuzz_targets/protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_ir"
path = "fuzz_targets/manifest_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_boundary"
path = "fuzz_targets/pdf_boundary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_ir"
path = "fuzz_targets/render_ir.rs"
test = false
doc = false
bench = false
