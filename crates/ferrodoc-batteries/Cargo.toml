[package]
name = "ferrodoc-batteries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["rulebased", "ocrs", "burn", "tesseract"]
rulebased = ["dep:ferrodoc-layout-rulebased"]
ocrs = ["dep:ferrodoc-engine-ocrs"]
burn = ["dep:ferrodoc-engine-burn"]
tesseract = ["dep:ferrodoc-engine-tesseract"]
ort = ["dep:ferrodoc-engine-ort"]
oar = ["dep:ferrodoc-engine-oar"]
oar-classic = ["dep:ferrodoc-engine-oar-classic"]
llamacpp = ["dep:ferrodoc-engine-llamacpp", "ferrodoc-engine-llamacpp/openmp"]
mistralrs = ["dep:ferrodoc-engine-mistralrs"]
remote = ["dep:ferrodoc-engine-remote"]
mistral-ocr = ["dep:ferrodoc-engine-mistral"]
all-local = ["rulebased", "ocrs", "burn", "tesseract", "ort", "oar", "oar-classic", "llamacpp", "mistralrs"]
all = ["all-local", "remote", "mistral-ocr"]
cuda = [
  "ferrodoc-engine-ort?/cuda",
  "ferrodoc-engine-oar?/cuda",
  "ferrodoc-engine-oar-classic?/cuda",
  "ferrodoc-engine-llamacpp?/cuda",
  "ferrodoc-engine-mistralrs?/cuda",
]
metal = [
  "ferrodoc-engine-oar?/metal",
  "ferrodoc-engine-llamacpp?/metal",
  "ferrodoc-engine-mistralrs?/metal",
]
vulkan = ["ferrodoc-engine-llamacpp?/vulkan"]

[dependencies]
anyhow.workspace = true
ferrodoc-pipeline = { path = "../ferrodoc-pipeline" }
ferrodoc-layout-rulebased = { path = "../../plugins/ferrodoc-layout-rulebased", optional = true }
ferrodoc-engine-ocrs = { path = "../../plugins/ferrodoc-engine-ocrs", optional = true }
ferrodoc-engine-burn = { path = "../../plugins/ferrodoc-engine-burn", optional = true }
ferrodoc-engine-tesseract = { path = "../../plugins/ferrodoc-engine-tesseract", optional = true }
ferrodoc-engine-ort = { path = "../../plugins/ferrodoc-engine-ort", optional = true }
ferrodoc-engine-oar = { path = "../../plugins/ferrodoc-engine-oar", optional = true }
ferrodoc-engine-oar-classic = { path = "../../plugins/ferrodoc-engine-oar-classic", optional = true }
ferrodoc-engine-llamacpp = { path = "../../plugins/ferrodoc-engine-llamacpp", optional = true, default-features = false }
ferrodoc-engine-mistralrs = { path = "../../plugins/ferrodoc-engine-mistralrs", optional = true }
ferrodoc-engine-remote = { path = "../../plugins/ferrodoc-engine-remote", optional = true }
ferrodoc-engine-mistral = { path = "../../plugins/ferrodoc-engine-mistral", optional = true }
