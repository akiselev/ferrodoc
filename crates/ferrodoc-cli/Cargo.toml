[package]
name = "ferrodoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Offline evidence-preserving document conversion"

[features]
default = ["cpu-minimal", "process-engines"]
cpu-minimal = ["ferrodoc-runtime/cpu-minimal"]
process-engines = ["ferrodoc-runtime/process-engines"]
tesseract = ["dep:ferrodoc-engine-tesseract", "ferrodoc-runtime/tesseract"]
nvml = ["ferrodoc-runtime/nvml"]

[[bin]]
name = "ferrodoc"
path = "src/main.rs"

[dependencies]
ferrodoc-core = { path = "../ferrodoc-core" }
ferrodoc-engine-api = { path = "../ferrodoc-engine-api" }
ferrodoc-engine-ocrs = { path = "../../engines/ferrodoc-engine-ocrs" }
ferrodoc-engine-tesseract = { path = "../../engines/ferrodoc-engine-tesseract", optional = true }
ferrodoc-layout-rulebased = { path = "../../engines/ferrodoc-layout-rulebased" }
ferrodoc-pdf = { path = "../ferrodoc-pdf" }
ferrodoc-render = { path = "../ferrodoc-render" }
ferrodoc-research = { path = "../ferrodoc-research" }
ferrodoc-router = { path = "../ferrodoc-router" }
ferrodoc-runtime = { path = "../ferrodoc-runtime" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
