[package]
name = "ferrodoc-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
nvml = ["dep:nvml-wrapper"]

[dependencies]
ferrodoc-core = { path = "../ferrodoc-core" }
ferrodoc-engine-api = { path = "../ferrodoc-engine-api" }
ferrodoc-engine-ocrs = { path = "../../engines/ferrodoc-engine-ocrs" }
ferrodoc-ir = { path = "../ferrodoc-ir" }
ferrodoc-layout-rulebased = { path = "../../engines/ferrodoc-layout-rulebased" }
ferrodoc-pdf = { path = "../ferrodoc-pdf" }
ferrodoc-protocol = { path = "../ferrodoc-protocol" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nvml-wrapper = { version = "0.11", optional = true }

[dev-dependencies]
ferrodoc-core = { path = "../ferrodoc-core" }
