[package]
name = "ferrodoc-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["cpu-minimal", "process-engines"]
cpu-minimal = []
process-engines = []
tesseract = ["dep:ferrodoc-engine-tesseract"]
nvml = ["dep:nvml-wrapper"]

[dependencies]
ferrodoc-core = { path = "../ferrodoc-core" }
ferrodoc-engine-api = { path = "../ferrodoc-engine-api" }
ferrodoc-engine-ocrs = { path = "../../engines/ferrodoc-engine-ocrs" }
ferrodoc-engine-tesseract = { path = "../../engines/ferrodoc-engine-tesseract", optional = true }
ferrodoc-ir = { path = "../ferrodoc-ir" }
ferrodoc-layout-rulebased = { path = "../../engines/ferrodoc-layout-rulebased" }
ferrodoc-pdf = { path = "../ferrodoc-pdf" }
ferrodoc-protocol = { path = "../ferrodoc-protocol" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nvml-wrapper = { version = "0.11", optional = true }
uuid.workspace = true

[dev-dependencies]
ferrodoc-core = { path = "../ferrodoc-core" }
ferrodoc-engine-command = { path = "../../engines/ferrodoc-engine-command" }
tempfile.workspace = true
