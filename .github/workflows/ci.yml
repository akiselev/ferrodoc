name: ci
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: ./scripts/check-workspace.sh
      - run: ./scripts/check-boundaries.sh
      - run: cargo run --locked -p xtask -- doctor
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --locked -p ferrodoc-runtime --features nvml
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p ferrodoc-ir --example export_snapshots
      - run: cargo run --locked -p ferrodoc-pdf --example export_survey_snapshots
      - run: cargo run --locked -p ferrodoc-pdf --example generate_fixtures
      - run: cargo run --locked -p ferrodoc-protocol --example export_fixtures
      - run: cargo run --locked -p ferrodoc-foundry --example export_foundry_schemas
      - run: cargo run --locked -p ferrodoc-bench --example export_benchmark_schemas
      - run: cargo run --locked -p ferrodoc-bench --example export_real_regression
      - run: cargo run --locked -p ferrodoc-router --example export_router_schemas
      - run: cargo run --locked -p ferrodoc-research --example export_research_schemas
      - run: cargo run --locked -p ferrodoc --example export_cli_schemas
      - run: ./scripts/smoke.sh
      - run: ./scripts/benchmark-smoke.sh
      - run: ./scripts/routing-smoke.sh
      - name: Qualify default native portfolio on fixed real corpus
        run: |
          cargo build --locked -p ferrodoc
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          ./scripts/engine-qualification.sh "$target_dir/debug/ferrodoc" "$RUNNER_TEMP/qualification"
      - run: git diff --exit-code

  process-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ferrodoc-engine-mock --test process
      - name: Test layout embedded/process parity
        run: |
          cargo build --locked -p ferrodoc-layout-rulebased --bin ferrodoc-layout-rulebased
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          FERRODOC_TEST_LAYOUT_BINARY="$target_dir/debug/ferrodoc-layout-rulebased" \
            cargo test --locked -p ferrodoc-runtime --test process_engines \
              layout_wrapper_matches_embedded_when_binary_is_provided -- --exact
      - name: Test experimental command embedded/process parity
        run: |
          cargo build --locked -p ferrodoc-engine-command --bin ferrodoc-engine-command
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          FERRODOC_TEST_COMMAND_BINARY="$target_dir/debug/ferrodoc-engine-command" \
            cargo test --locked -p ferrodoc-runtime --test process_engines \
              experimental_command_wrapper_matches_embedded_without_a_shell -- --exact

  vertical-slice-ocrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Fetch and verify optional OCRS models
        run: |
          mkdir -p "$RUNNER_TEMP/ocrs-models"
          curl --fail --location --silent --show-error \
            https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten \
            --output "$RUNNER_TEMP/ocrs-models/text-detection.rten"
          curl --fail --location --silent --show-error \
            https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.rten \
            --output "$RUNNER_TEMP/ocrs-models/text-recognition.rten"
          echo "f15cfb56bd02c4bf478a20343986504a1f01e1665c2b3a0ad66340f054b1b5ca  $RUNNER_TEMP/ocrs-models/text-detection.rten" | sha256sum --check
          echo "e484866d4cce403175bd8d00b128feb08ab42e208de30e42cd9889d8f1735a6e  $RUNNER_TEMP/ocrs-models/text-recognition.rten" | sha256sum --check
      - name: Test scanned and hybrid conversion
        env:
          FERRODOC_TEST_OCRS_MODEL_DIR: ${{ runner.temp }}/ocrs-models
        run: cargo test --locked -p ferrodoc --test cli model_backed_scan_and_hybrid_when_models_are_provided -- --exact
      - name: Verify content-addressed model installation
        run: |
          cargo run --locked -p ferrodoc -- models pull \
            --manifest models/ocrs-cpu.json \
            --source "$RUNNER_TEMP/ocrs-models" \
            --store "$RUNNER_TEMP/ferrodoc-model-store" \
            --accept
          cargo run --locked -p ferrodoc -- models verify \
            --store "$RUNNER_TEMP/ferrodoc-model-store"
      - name: Test OCRS embedded/process parity
        env:
          FERRODOC_TEST_OCRS_MODEL_DIR: ${{ runner.temp }}/ocrs-models
        run: |
          cargo build --locked -p ferrodoc-engine-ocrs --bin ferrodoc-engine-ocrs
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          FERRODOC_TEST_OCRS_BINARY="$target_dir/debug/ferrodoc-engine-ocrs" \
            cargo test --locked -p ferrodoc-runtime --test process_engines \
              ocrs_wrapper_matches_embedded_when_binary_and_models_are_provided -- --exact
      - name: Qualify OCRS portfolio on fixed real corpus
        env:
          FERRODOC_TEST_OCRS_MODEL_DIR: ${{ runner.temp }}/ocrs-models
        run: |
          cargo build --locked -p ferrodoc
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          ./scripts/engine-qualification.sh "$target_dir/debug/ferrodoc" "$RUNNER_TEMP/qualification"

  optional-tesseract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install optional Tesseract runtime and English data
        run: |
          sudo apt-get update
          sudo apt-get install --yes libtesseract-dev tesseract-ocr-eng
      - name: Run native C-API conformance
        env:
          FERRODOC_REQUIRE_TESSERACT: "1"
        run: cargo test --locked -p ferrodoc-engine-tesseract --test conformance
      - name: Test Tesseract embedded/process parity
        run: |
          cargo build --locked -p ferrodoc-engine-tesseract --bin ferrodoc-engine-tesseract
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          FERRODOC_TEST_TESSERACT_BINARY="$target_dir/debug/ferrodoc-engine-tesseract" \
            cargo test --locked -p ferrodoc-runtime --features tesseract --test process_engines \
              tesseract_wrapper_matches_embedded_when_binary_and_dependency_are_provided -- --exact
      - name: Test scanned conversion through Tesseract
        run: |
          cargo run --locked -p ferrodoc --features tesseract -- convert \
            fixtures/pdf/image-only.pdf --ocr-engine tesseract --format markdown \
            --output "$RUNNER_TEMP/tesseract.md"
          test "$(cat "$RUNNER_TEMP/tesseract.md")" = $'SCANNED FERRODOC PAGE\nOptical text survives the CPU path.'
      - name: Qualify Tesseract portfolio on fixed real corpus
        env:
          FERRODOC_TEST_TESSERACT: "1"
        run: |
          target_dir=$(cargo metadata --locked --format-version 1 --no-deps | jq -r .target_directory)
          ./scripts/engine-qualification.sh "$target_dir/debug/ferrodoc" "$RUNNER_TEMP/qualification"

  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p ferrodoc-core -p ferrodoc-ir -p ferrodoc-protocol -p ferrodoc
      - run: cargo test --locked -p ferrodoc-core -p ferrodoc-ir -p ferrodoc-protocol -p ferrodoc

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  docs-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: cargo test --workspace --doc --locked
      - run: ./scripts/readme-smoke.sh
      - run: ./scripts/release-check.sh

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
