[workspace]
resolver = "2"
members = [
  "crates/ferrodoc-core",
  "crates/ferrodoc-ir",
]
default-members = ["crates/ferrodoc-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Ferrodoc contributors"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
proptest = "1.7"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3.17"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
