[workspace]
resolver = "2"
members = [
  "crates/ferrodoc-core",
  "crates/ferrodoc-engine-api",
  "crates/ferrodoc-ir",
  "crates/ferrodoc-pdf",
  "crates/ferrodoc-plugin-sdk",
  "crates/ferrodoc-protocol",
  "crates/ferrodoc-render",
  "crates/ferrodoc-runtime",
  "crates/ferrodoc-cli",
  "engines/ferrodoc-layout-rulebased",
  "engines/ferrodoc-engine-ocrs",
  "engines/ferrodoc-engine-mock",
  "tools/xtask",
]
default-members = ["crates/ferrodoc-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Ferrodoc contributors"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
hex = "0.4"
hayro = "0.7.0"
lopdf = { version = "0.36.0", default-features = false }
ocrs = "0.12.2"
proptest = "1.7"
schemars = "0.8"
rten = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3.17"
thiserror = "2.0"
uuid = { version = "1.12", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
